<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Car Tracker</title>
</head>
<body>
  <h1>Car Tracker</h1>

  <h2>Προσθήκη οχήματος</h2>
  <form id="vehicle-form">
    <input id="make" placeholder="Μάρκα" required>
    <input id="model" placeholder="Μοντέλο" required>
    <input id="year" type="number" placeholder="Έτος" required>
    <input id="plate" placeholder="Πινακίδα" required>
    <input id="odometer" type="number" placeholder="Χιλιόμετρα">
    <button type="submit">Προσθήκη</button>
  </form>
  <p id="message"></p>

  <h2>Τα οχήματά μου (πάτα πάνω σε ένα για λεπτομέρειες)</h2>
  <ul id="vehicle-list"></ul>

  <div id="details" hidden>
    <h2 id="details-title"></h2>

    <h3>Κατανάλωση καυσίμου</h3>
    <p id="fuel-stats"></p>

    <h3>Ιστορικό service</h3>
    <ul id="service-list"></ul>
  </div>

  <script>
    async function loadVehicles() {
      const response = await fetch("/vehicles");
      const vehicles = await response.json();

      const list = document.getElementById("vehicle-list");
      list.innerHTML = "";

      for (const v of vehicles) {
        const li = document.createElement("li");
        li.textContent = `${v.make} ${v.model} (${v.year}) - ${v.plate} - ${v.odometer_km} km`;
        li.style.cursor = "pointer";
        li.addEventListener("click", () => showDetails(v));
        list.appendChild(li);
      }
    }

    async function showDetails(vehicle) {
      document.getElementById("details").hidden = false;
      document.getElementById("details-title").textContent =
        `${vehicle.make} ${vehicle.model} - ${vehicle.plate}`;

      const [servicesResponse, statsResponse] = await Promise.all([
        fetch(`/vehicles/${vehicle.id}/services`),
        fetch(`/vehicles/${vehicle.id}/fuel/stats`),
      ]);
      const services = await servicesResponse.json();
      const stats = await statsResponse.json();

      const statsText = document.getElementById("fuel-stats");
      if (stats.avg_consumption_l_per_100km === null) {
        statsText.textContent = "Δεν υπάρχουν αρκετά δεδομένα (χρειάζονται τουλάχιστον 2 ανεφοδιασμοί).";
      } else {
        statsText.textContent =
          `Μέση κατανάλωση: ${stats.avg_consumption_l_per_100km} L/100km - ` +
          `Χιλιόμετρα: ${stats.total_km} - Συνολικό κόστος: ${stats.total_cost} €`;
      }

      const serviceList = document.getElementById("service-list");
      serviceList.innerHTML = "";
      if (services.length === 0) {
        serviceList.textContent = "Δεν υπάρχουν καταχωρημένα service.";
      }
      for (const s of services) {
        const li = document.createElement("li");
        li.textContent = `${s.service_date} - ${s.service_type} - ${s.odometer_km} km - ${s.cost} €`;
        if (s.notes) {
          li.textContent += ` (${s.notes})`;
        }
        serviceList.appendChild(li);
      }
    }

    document.getElementById("vehicle-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = document.getElementById("message");

      const vehicle = {
        make: document.getElementById("make").value,
        model: document.getElementById("model").value,
        year: Number(document.getElementById("year").value),
        plate: document.getElementById("plate").value,
        odometer_km: Number(document.getElementById("odometer").value) || 0,
      };

      const response = await fetch("/vehicles", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(vehicle),
      });

      if (response.ok) {
        message.textContent = "Το όχημα προστέθηκε!";
        event.target.reset();
        loadVehicles();
      } else if (response.status === 409) {
        const error = await response.json();
        message.textContent = "Σφάλμα: " + error.detail;
      } else {
        message.textContent = "Κάτι πήγε στραβά (κωδικός " + response.status + ")";
      }
    });

    loadVehicles();
  </script>
</body>
</html>
