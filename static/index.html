<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Car Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Car Tracker</h1>

  <section id="summary" hidden>
    <h2>Χρειάζονται προσοχή</h2>
    <ul id="summary-list"></ul>
  </section>

  <h2>Προσθήκη οχήματος</h2>
  <form id="vehicle-form">
    <input id="make" placeholder="Μάρκα" required>
    <input id="model" placeholder="Μοντέλο" required>
    <input id="year" type="number" placeholder="Έτος" required>
    <input id="plate" placeholder="Πινακίδα" required>
    <input id="odometer" type="number" placeholder="Χιλιόμετρα">
    <button type="submit">Προσθήκη</button>
  </form>
  <p id="message"></p>

  <h2>Τα οχήματά μου (πάτα πάνω σε ένα για λεπτομέρειες)</h2>
  <ul id="vehicle-list"></ul>

  <div id="details" hidden>
    <h2 id="details-title"></h2>

    <h3>Υπενθυμίσεις</h3>
    <ul id="reminder-list"></ul>
    <form id="reminder-form">
      <input id="reminder-title" placeholder="Τίτλος (π.χ. ΚΤΕΟ)" required>
      <label>Έως <input id="reminder-date" type="date"></label>
      <input id="reminder-km" type="number" placeholder="ή στα χιλιόμετρα">
      <button type="submit">Προσθήκη υπενθύμισης</button>
    </form>

    <h3>Κατανάλωση καυσίμου</h3>
    <p id="fuel-stats"></p>

    <h3>Ιστορικό ανεφοδιασμών</h3>
    <ul id="fuel-list"></ul>

    <h3>Ιστορικό service</h3>
    <ul id="service-list"></ul>

    <h3>Νέο service</h3>
    <form id="service-form">
      <label>Ημερομηνία <input id="service-date" type="date" required></label>
      <input id="service-odometer" type="number" placeholder="Χιλιόμετρα" required>
      <input id="service-type" placeholder="Τύπος (π.χ. Φρένα)" required>
      <input id="service-cost" type="number" step="any" placeholder="Κόστος €">
      <input id="service-notes" placeholder="Σημειώσεις">
      <button type="submit">Προσθήκη service</button>
    </form>

    <h3>Νέος ανεφοδιασμός</h3>
    <form id="fuel-form">
      <label>Ημερομηνία <input id="fuel-date" type="date" required></label>
      <input id="fuel-odometer" type="number" placeholder="Χιλιόμετρα" required>
      <input id="fuel-liters" type="number" step="any" placeholder="Λίτρα" required>
      <input id="fuel-cost" type="number" step="any" placeholder="Συνολικό κόστος €" required>
      <button type="submit">Προσθήκη ανεφοδιασμού</button>
    </form>

    <p id="detail-message"></p>
  </div>

  <script>
    let currentVehicleId = null;

    function postJson(url, data) {
      return fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
    }

    async function showResult(response, messageElement, successText) {
      if (response.ok) {
        messageElement.textContent = successText;
        return true;
      }
      if (response.status === 409 || response.status === 404 || response.status === 400) {
        const error = await response.json();
        messageElement.textContent = "Σφάλμα: " + error.detail;
      } else {
        messageElement.textContent = "Κάτι πήγε στραβά (κωδικός " + response.status + ")";
      }
      return false;
    }

    async function loadVehicles() {
      const response = await fetch("/vehicles");
      const vehicles = await response.json();

      const list = document.getElementById("vehicle-list");
      list.innerHTML = "";

      for (const v of vehicles) {
        const li = document.createElement("li");
        li.textContent = `${v.make} ${v.model} (${v.year}) - ${v.plate} - ${v.odometer_km} km`;
        li.style.cursor = "pointer";
        li.addEventListener("click", () => {
          document.getElementById("detail-message").textContent = "";
          showDetails(v.id);
        });
        list.appendChild(li);
      }
    }

    async function showDetails(vehicleId) {
      currentVehicleId = vehicleId;
      loadFuel(vehicleId);
      loadReminders(vehicleId);
      document.getElementById("details").hidden = false;

      const [vehicleResponse, servicesResponse, statsResponse] = await Promise.all([
        fetch(`/vehicles/${vehicleId}`),
        fetch(`/vehicles/${vehicleId}/services`),
        fetch(`/vehicles/${vehicleId}/fuel/stats`),
      ]);
      const vehicle = await vehicleResponse.json();
      const services = await servicesResponse.json();
      const stats = await statsResponse.json();

      document.getElementById("details-title").textContent =
        `${vehicle.make} ${vehicle.model} - ${vehicle.plate}`;

      const statsText = document.getElementById("fuel-stats");
      if (stats.avg_consumption_l_per_100km === null) {
        statsText.textContent = "Δεν υπάρχουν αρκετά δεδομένα (χρειάζονται τουλάχιστον 2 ανεφοδιασμοί).";
      } else {
        statsText.textContent =
          `Μέση κατανάλωση: ${stats.avg_consumption_l_per_100km} L/100km - ` +
          `Χιλιόμετρα: ${stats.total_km} - Συνολικό κόστος: ${stats.total_cost} €`;
      }

      const serviceList = document.getElementById("service-list");
      serviceList.innerHTML = "";
      if (services.length === 0) {
        serviceList.textContent = "Δεν υπάρχουν καταχωρημένα service.";
      }
      for (const s of services) {
        const li = document.createElement("li");
        li.textContent = `${s.service_date} - ${s.service_type} - ${s.odometer_km} km - ${s.cost} €`;
        if (s.notes) {
          li.textContent += ` (${s.notes})`;
        }

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "Διαγραφή";
        deleteButton.style.marginLeft = "10px";
        deleteButton.addEventListener("click", async () => {
          await fetch(`/services/${s.id}`, { method: "DELETE" });
          showDetails(currentVehicleId);
        });
        li.appendChild(deleteButton);

        serviceList.appendChild(li);
      }
    }

    function describeReminder(r) {
      const parts = [];
      if (r.days_left !== null) {
        parts.push(r.days_left < 0
          ? `έληξε πριν ${-r.days_left} μέρες`
          : `σε ${r.days_left} μέρες (${r.due_date})`);
      }
      if (r.km_left !== null) {
        parts.push(r.km_left < 0
          ? `ξεπεράστηκε κατά ${-r.km_left} km`
          : `σε ${r.km_left} km (στα ${r.due_odometer_km} km)`);
      }
      return parts.join(" ή ");
    }

    async function loadSummary() {
      const response = await fetch("/summary/reminders");
      const items = await response.json();

      const section = document.getElementById("summary");
      const list = document.getElementById("summary-list");
      list.innerHTML = "";
      section.hidden = items.length === 0;

      for (const r of items) {
        const li = document.createElement("li");
        li.classList.add("reminder", r.status);
        li.style.cursor = "pointer";
        li.textContent = `${r.vehicle_label}: ${r.title} - ${describeReminder(r)}`;
        li.addEventListener("click", async () => {
          await showDetails(r.vehicle_id);
          document.getElementById("details").scrollIntoView({ behavior: "smooth" });
        });
        list.appendChild(li);
      }
    }

    async function loadFuel(vehicleId) {
      const response = await fetch(`/vehicles/${vehicleId}/fuel`);
      const entries = await response.json();

      const fuelList = document.getElementById("fuel-list");
      fuelList.innerHTML = "";
      if (entries.length === 0) {
        fuelList.textContent = "Δεν υπάρχουν καταχωρημένοι ανεφοδιασμοί.";
      }
      for (const f of entries) {
        const li = document.createElement("li");
        li.textContent = `${f.fuel_date} - ${f.odometer_km} km - ${f.liters} L - ${f.total_cost} €`;
        const deleteButton = document.createElement("button");
        deleteButton.textContent = "Διαγραφή";
        deleteButton.style.marginLeft = "10px";
        deleteButton.addEventListener("click", async () => {
          await fetch(`/fuel/${f.id}`, { method: "DELETE" });
          showDetails(currentVehicleId);
        });
        li.appendChild(deleteButton);

        fuelList.appendChild(li);
      }
    }

    async function loadReminders(vehicleId) {
      loadSummary();
      const response = await fetch(`/vehicles/${vehicleId}/reminders`);
      const reminders = await response.json();

      const list = document.getElementById("reminder-list");
      list.innerHTML = "";
      if (reminders.length === 0) {
        list.textContent = "Δεν υπάρχουν υπενθυμίσεις.";
      }
      for (const r of reminders) {
        const li = document.createElement("li");
        li.classList.add("reminder", r.status);

        const parts = [];
        if (r.days_left !== null) {
          parts.push(r.days_left < 0
            ? `έληξε πριν ${-r.days_left} μέρες`
            : `σε ${r.days_left} μέρες (${r.due_date})`);
        }
        if (r.km_left !== null) {
          parts.push(r.km_left < 0
            ? `ξεπεράστηκε κατά ${-r.km_left} km`
            : `σε ${r.km_left} km (στα ${r.due_odometer_km} km)`);
        }
        li.textContent = `${r.title} - ${parts.join(" ή ")}`;

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "Διαγραφή";
        deleteButton.style.marginLeft = "10px";
        deleteButton.addEventListener("click", async () => {
          await fetch(`/reminders/${r.id}`, { method: "DELETE" });
          loadReminders(currentVehicleId);
        });
        li.appendChild(deleteButton);

        list.appendChild(li);
      }
    }

    document.getElementById("reminder-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const kmValue = document.getElementById("reminder-km").value;
      const reminder = {
        title: document.getElementById("reminder-title").value,
        due_date: document.getElementById("reminder-date").value || null,
        due_odometer_km: kmValue ? Number(kmValue) : null,
      };
      const response = await postJson(`/vehicles/${currentVehicleId}/reminders`, reminder);
      const ok = await showResult(response, document.getElementById("detail-message"), "Η υπενθύμιση προστέθηκε!");
      if (ok) {
        event.target.reset();
        loadReminders(currentVehicleId);
      }
    });

    async function refreshAll() {
      await loadVehicles();
      if (currentVehicleId !== null) {
        await showDetails(currentVehicleId);
      }
    }

    document.getElementById("vehicle-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const vehicle = {
        make: document.getElementById("make").value,
        model: document.getElementById("model").value,
        year: Number(document.getElementById("year").value),
        plate: document.getElementById("plate").value,
        odometer_km: Number(document.getElementById("odometer").value) || 0,
      };
      const response = await postJson("/vehicles", vehicle);
      const ok = await showResult(response, document.getElementById("message"), "Το όχημα προστέθηκε!");
      if (ok) {
        event.target.reset();
        loadVehicles();
      }
    });

    document.getElementById("service-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const record = {
        service_date: document.getElementById("service-date").value,
        odometer_km: Number(document.getElementById("service-odometer").value),
        service_type: document.getElementById("service-type").value,
        cost: Number(document.getElementById("service-cost").value) || 0,
        notes: document.getElementById("service-notes").value || null,
      };
      const response = await postJson(`/vehicles/${currentVehicleId}/services`, record);
      const ok = await showResult(response, document.getElementById("detail-message"), "Το service προστέθηκε!");
      if (ok) {
        event.target.reset();
        refreshAll();
      }
    });

    document.getElementById("fuel-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const entry = {
        fuel_date: document.getElementById("fuel-date").value,
        odometer_km: Number(document.getElementById("fuel-odometer").value),
        liters: Number(document.getElementById("fuel-liters").value),
        total_cost: Number(document.getElementById("fuel-cost").value),
      };
      const response = await postJson(`/vehicles/${currentVehicleId}/fuel`, entry);
      const ok = await showResult(response, document.getElementById("detail-message"), "Ο ανεφοδιασμός προστέθηκε!");
      if (ok) {
        event.target.reset();
        refreshAll();
      }
    });

    loadVehicles();
  loadSummary();
  </script>
</body>
</html>
